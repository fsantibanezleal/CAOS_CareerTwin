name: Quality
on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: careertwin_test
          POSTGRES_USER: careertwin
          POSTGRES_PASSWORD: test-only-password
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U careertwin -d careertwin_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      APP_ENV: test
      APP_SECRET_KEY: test-secret-that-is-long-and-never-production
      APP_CSRF_SECRET: test-csrf-that-is-long-and-never-production
      DATABASE_URL: postgresql+psycopg://careertwin:test-only-password@localhost:5432/careertwin_test
      REDIS_URL: redis://localhost:6379/0
      LLM_DEFAULT_PROVIDER: mock
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: python -m ruff check backend tests evals
      - run: python -m mypy backend evals
      - run: python -m alembic upgrade head
      - run: python -m pytest --cov --cov-report=term-missing
      - run: python evals/agent_contract.py
      - run: python -m pip check
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.18.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-dist
          path: frontend/dist
          if-no-files-found: error
