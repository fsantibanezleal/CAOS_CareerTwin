name: Container
on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop]
permissions:
  contents: read
  security-events: write
jobs:
  build-scan-sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          load: true
          tags: careertwin:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Immutable v0.36.0 commit; do not replace with a mutable tag.
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: careertwin:ci
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          exit-code: '1'
          scanners: vuln
          limit-severities-for-sarif: true
      - uses: github/codeql-action/upload-sarif@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4
        if: always()
        with:
          sarif_file: trivy-results.sarif
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: careertwin:ci
          artifact-name: careertwin-sbom.spdx.json
          format: spdx-json
