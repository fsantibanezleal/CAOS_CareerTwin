name: Container
on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop]
permissions:
  contents: read
  security-events: write
jobs:
  build-scan-sbom:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: app
            dockerfile: Dockerfile
            image: careertwin
          - name: postgres
            dockerfile: docker/postgres/Dockerfile
            image: careertwin-db
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          load: true
          tags: ${{ matrix.image }}:ci
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
      - id: grype
        uses: anchore/scan-action@8964e60c6fabdb85fdbbbfd9834d8f19c97a3086 # v7.4.1
        with:
          image: ${{ matrix.image }}:ci
          fail-build: true
          severity-cutoff: high
          output-format: sarif
          output-file: grype-${{ matrix.name }}.sarif
          grype-version: v0.112.0
          cache-db: true
          vex: security/openvex.json
      - uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        if: always()
        with:
          sarif_file: grype-${{ matrix.name }}.sarif
          category: container-${{ matrix.name }}
      - uses: anchore/sbom-action@aa80c8c5bd439a416a62804f2151ab38c671a638 # v0.24.1
        with:
          image: ${{ matrix.image }}:ci
          artifact-name: ${{ matrix.image }}-sbom.spdx.json
          format: spdx-json
